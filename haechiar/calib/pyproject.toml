[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "firesight-calib"
version = "0.3.0"
description = "Boson 320 thermal intrinsic calibration with USB and ROS 2 capture"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3", "opencv-python>=4.10,<5", "PyYAML>=6,<7"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
firesight-calib = "firesight_calib.cli:main"
calib_home = "firesight_calib.cli:home"

[tool.setuptools.packages.find]
where = ["calib"]
include = ["firesight_calib*"]

[tool.setuptools.package-data]
"firesight_calib.experiments" = ["profiles/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["calib/test"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
