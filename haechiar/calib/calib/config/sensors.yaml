schema: firesight.sensors/v1
rig_id: firesight_rig_01
rig_revision: provisional_01
sensors:
  boson:
    model: FLIR Boson 320
    part_number: 20320A050-9PAAX
    native_image_size: [320, 256]
    radiometric: false
    lens_focal_length_mm: 4.3
    image_topic: /boson/image_raw
    optical_frame: boson_optical_frame
    encodings: [mono8, mono16]
  d456:
    model: Intel RealSense D456
    color_topic: /camera/color/image_raw
    color_info_topic: /camera/color/camera_info
    color_optical_frame: camera_color_optical_frame
    depth_topic: /camera/depth/image_rect_raw
    depth_info_topic: /camera/depth/camera_info
    depth_optical_frame: camera_depth_optical_frame
  livox:
    model: Livox Mid-360S
    points_topic: /livox/lidar
    frame: livox_frame
sync:
  max_delta_s: 0.10
  queue_size: 20

